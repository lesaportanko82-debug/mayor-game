<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мэр на данных — квест Skill Route</title>
<meta name="description" content="Квест для будущих продактов: управляйте городом Инсайтград и принимайте решения на основе данных.">
<meta property="og:title" content="Мэр на данных — квест Skill Route">
<meta property="og:description" content="24 месяца на посту мэра: метрики, воронки, A/B-тесты, RICE и выборы в финале.">
<meta name="theme-color" content="#ffd21f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23ffd21f' stroke='%231e1b33' stroke-width='5'/%3E%3Cpath d='M20 44V30l6-5 6 5v14M32 44V22l8-6 8 6v22' fill='%23fff' stroke='%231e1b33' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Rubik:wght@700;800;900&display=swap">
<style>
/* Comic-strip quest: sticky HUD + living cartoon city on top, chapters below as illustrated panels. */
:root{
  --ink:#1e1b33;--bg:#dff1ff;--paper:#fff;--muted:#56536e;
  --sun:#ffd21f;--sun-soft:#fff3b8;--pink:#ff5fa8;--pink-soft:#ffe1ef;
  --green:#22b87a;--green-soft:#d8f7e8;--red:#f04a3a;--red-soft:#ffe1dc;--blue:#3d8bff;--blue-soft:#dcebff;--violet:#8b6cff;
  --f-display:'Rubik','Arial Black',system-ui,sans-serif;
  --f-body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --line:3px solid var(--ink);--shadow:5px 5px 0 var(--ink);--topH:250px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.55;font-weight:500;
  background-image:radial-gradient(rgba(30,27,51,.06) 1.4px,transparent 1.5px);background-size:18px 18px;
  padding-bottom:env(safe-area-inset-bottom,0px)}
img,svg{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* ---------- top ---------- */
.top{position:sticky;top:0;z-index:20}
@media (max-height:740px){.top{position:relative}}
.hudBand{background:var(--sun);border-bottom:var(--line);padding-top:env(safe-area-inset-top,0px)}
.hud{max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:9px max(16px,env(safe-area-inset-right,0px)) 9px max(16px,env(safe-area-inset-left,0px))}
.brand{font-family:var(--f-display);font-weight:900;font-size:19px;line-height:1;letter-spacing:-.01em}
.sr{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);text-decoration:none;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:3px 10px 3px 3px}
.sr-mark{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;border:2px solid var(--ink);font-weight:900;font-size:8px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:3px 10px;font-family:var(--f-display);font-weight:800;font-size:13px;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.pill svg{width:16px;height:16px}
.lvl{display:inline-flex;flex-direction:column;gap:2px;min-width:118px}
.lvl b{font-size:12px;line-height:1.1}
.lvlbar{height:6px;border-radius:3px;background:#eee;border:1.5px solid var(--ink);overflow:hidden}
.lvlbar i{display:block;height:100%;width:0;background:var(--green);transition:width .6s}
.streak{background:#ffe4d1}
.streak[data-n="0"]{opacity:.45}
.stats{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.stat{position:relative;display:flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);box-shadow:2px 2px 0 var(--ink)}
.stat svg{width:22px;height:22px;flex:0 0 22px}
.stat span{display:flex;flex-direction:column;line-height:1.05}
.stat b{font-family:var(--f-display);font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.stat small{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.stat.up{background:var(--green-soft)}.stat.down{background:var(--red-soft)}
.fl{position:absolute;right:2px;top:-12px;font-family:var(--f-display);font-weight:900;font-size:13px;pointer-events:none;animation:fl 1.4s ease-out forwards;background:var(--paper);border:1.5px solid var(--ink);border-radius:6px;padding:0 4px}
.fl.p{color:var(--green)}.fl.n{color:var(--red)}
@keyframes fl{0%{opacity:1;transform:translateY(0) scale(.8)}20%{transform:translateY(-6px) scale(1.1)}100%{opacity:0;transform:translateY(-22px)}}

.cityWrap{position:relative;height:200px;border-bottom:var(--line);overflow:hidden;background:#8fd3ff}
@media (min-width:700px){.cityWrap{height:230px}}
#city{display:block;width:100%;height:100%}
.cityTag{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:10px;font-family:var(--f-display);font-size:12px;font-weight:800;background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:3px 9px;box-shadow:2px 2px 0 var(--ink)}
.cityTag b{color:var(--pink)}
.chapters{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:10px;display:flex;gap:3px;align-items:center;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:5px 8px;box-shadow:2px 2px 0 var(--ink)}
.chapters span{width:9px;height:9px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);transition:background .3s,transform .3s}
.chapters span.done{background:var(--green)}.chapters span.now{background:var(--sun);transform:scale(1.3)}

/* ---------- stage ---------- */
.stage{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding:26px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px))}
.stage>*{scroll-margin-top:calc(var(--topH) + 14px);scroll-margin-bottom:24px;animation:pop .35s cubic-bezier(.3,1.4,.6,1) both}
@keyframes pop{from{opacity:.001;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.eyebrow{display:inline-block;align-self:flex-start;font-family:var(--f-display);font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;background:var(--ink);color:var(--sun);padding:5px 10px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(40px,9vw,72px);font-weight:900;letter-spacing:-.02em}
h1 mark{background:var(--sun);color:var(--ink);padding:0 .12em;border-radius:.12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
h2{font-size:clamp(25px,5vw,34px);font-weight:900;letter-spacing:-.01em}
h3{font-size:19px;font-weight:800}
p{margin:0}
.chHead{display:flex;flex-direction:column;gap:10px}
.chHead .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.month{font-family:var(--f-display);font-weight:800;font-size:12px;background:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:3px 8px}

.scene{border:var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);background:#fff;line-height:0}
.scene svg{width:100%;height:auto;display:block}

/* dialog */
.line{display:flex;gap:10px;align-items:flex-end}
.ava{flex:0 0 64px;width:64px;height:64px;border-radius:50%;border:var(--line);background:#fff;overflow:hidden;box-shadow:3px 3px 0 var(--ink)}
.ava svg{display:block;width:100%;height:100%}
.bubble{position:relative;min-width:0;flex:1;background:var(--paper);border:var(--line);border-radius:20px;padding:11px 16px 13px;box-shadow:4px 4px 0 var(--ink);margin-bottom:8px}
.bubble::before{content:"";position:absolute;left:-15px;bottom:14px;border:9px solid transparent;border-right:14px solid var(--ink);border-left:0}
.bubble::after{content:"";position:absolute;left:-9px;bottom:17px;border:6px solid transparent;border-right:10px solid var(--paper);border-left:0}
.who{font-family:var(--f-display);font-size:13px;font-weight:800;margin-bottom:2px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.who em{font-style:normal;font-family:var(--f-body);font-weight:600;color:var(--muted);font-size:12.5px}
.txt{font-size:17px;line-height:1.5;font-weight:500;max-width:62ch}
.txt.typing::after{content:"▍";animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.narr{background:var(--sun);border:var(--line);border-radius:6px;padding:10px 14px;box-shadow:4px 4px 0 var(--ink)}
.narr .txt{font-weight:700;font-size:16px}
.hintBox{background:var(--blue-soft);border:2.5px dashed var(--blue);border-radius:12px;padding:10px 14px;font-weight:600}
.hintBox b{color:var(--blue)}

/* buttons */
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--paper);border:var(--line);border-radius:14px;padding:12px 14px;box-shadow:4px 4px 0 var(--ink);font-weight:600;transition:transform .1s,box-shadow .1s,background .2s}
.choice:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);background:var(--sun-soft)}
.choice:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.choice:disabled{cursor:default;opacity:.5;box-shadow:2px 2px 0 var(--ink)}
.key{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:15px;font-weight:900;background:var(--sun);border:2.5px solid var(--ink)}
.choice.picked{opacity:1}.choice.ok{background:var(--green-soft)}.choice.ok .key{background:var(--green);color:#fff}
.choice.bad{background:var(--red-soft)}.choice.bad .key{background:var(--red);color:#fff}
.choice.mid{background:var(--sun-soft)}.choice.right{opacity:1;border-style:dashed;background:var(--green-soft)}
.btn{align-self:flex-start;background:var(--sun);border:var(--line);border-radius:12px;padding:10px 20px;font-family:var(--f-display);font-size:15px;font-weight:800;box-shadow:4px 4px 0 var(--ink);transition:transform .1s,box-shadow .1s;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:2px 2px 0 var(--ink)}
.btn.ghost{background:#fff;font-size:14px}.btn.pinkb{background:var(--pink);color:#fff}.btn.redb{background:var(--red);color:#fff}.btn.big{font-size:19px;padding:14px 26px;font-weight:900}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* feedback */
.fb{border:var(--line);border-radius:18px;padding:18px;background:var(--paper);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.fbTop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fb-tag{font-family:var(--f-display);font-size:15px;font-weight:900;letter-spacing:.02em;text-transform:uppercase;padding:5px 12px;border:2.5px solid var(--ink);border-radius:8px;transform:rotate(-2deg);box-shadow:2px 2px 0 var(--ink)}
.fb.ok .fb-tag{background:var(--green);color:#fff}.fb.bad .fb-tag{background:var(--red);color:#fff}.fb.mid .fb-tag{background:var(--sun)}
.xpTag{font-family:var(--f-display);font-weight:900;font-size:14px;color:var(--green)}
.fb p{max-width:64ch}
.lesson{position:relative;background:var(--sun-soft);border:2.5px solid var(--ink);border-radius:6px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:4px;margin-top:4px}
.lesson::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:18px;margin-left:-35px;background:rgba(255,95,168,.55);border:1.5px solid rgba(30,27,51,.35);transform:rotate(-3deg)}
.lesson span{font-family:var(--f-display);font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#d23f86}
.lesson p{font-size:16.5px;font-weight:600;line-height:1.45}

/* panels */
.panel{border:var(--line);border-radius:18px;padding:16px;background:var(--paper);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cap,.panel-h small{font-size:13px;font-weight:600;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(80px,120px) 1fr 46px;gap:10px;align-items:center;font-weight:700;font-size:15px}
.track{height:20px;border-radius:999px;background:#eef3f8;border:2.5px solid var(--ink);overflow:hidden}
.fill{height:100%;width:0;background:var(--blue);transition:width 1s cubic-bezier(.3,1.3,.5,1)}
.bar.hot .fill{background:var(--pink)}
.v{font-family:var(--f-display);font-weight:800;font-size:15px;text-align:right;font-variant-numeric:tabular-nums}

.funnel{display:flex;flex-direction:column;gap:4px}
.fstep{display:flex;flex-direction:column;gap:4px;background:none;border:0;padding:5px;border-radius:12px;text-align:left;width:100%}
.fstep:hover:not(:disabled){background:var(--sun-soft)}.fstep:disabled{cursor:default}
.flabel{font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.flabel em{font-style:normal;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.ftrack{height:22px}.fbar{display:block;height:100%;width:0;border-radius:6px;background:var(--blue);border:2.5px solid var(--ink);transition:width .9s cubic-bezier(.3,1.3,.5,1)}
.drop{font-size:14px;font-weight:700;color:var(--muted);padding-left:6px;height:0;overflow:hidden;transition:height .3s}
.funnel.revealed .drop{height:22px}.drop.big{color:var(--red)}
.fstep.ok{background:var(--green-soft)}.fstep.ok .fbar{background:var(--green)}.fstep.bad{background:var(--red-soft)}.fstep.bad .fbar{background:var(--red)}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2.5px solid var(--ink);background:var(--paper);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px;box-shadow:2px 2px 0 var(--ink);text-align:left}
.chip[aria-pressed="true"]{background:var(--sun)}
.chip.vanity{background:var(--pink-soft)}.chip.useful{background:var(--green-soft)}.chip.miss{outline:3px dashed var(--red);outline-offset:3px}
.chip:disabled{cursor:default}

/* interview */
.residents{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.res{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--paper);border:var(--line);border-radius:16px;padding:12px 8px;box-shadow:3px 3px 0 var(--ink)}
.res .ava{flex:none}
.res b{font-family:var(--f-display);font-size:14px}.res small{font-size:12px;color:var(--muted);font-weight:600;line-height:1.3}
.qlist{display:flex;flex-direction:column;gap:8px}
.q{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px;font-weight:600;box-shadow:2px 2px 0 var(--ink)}
.q[aria-pressed="true"]{background:var(--sun-soft)}
.q .box{flex:0 0 22px;height:22px;border:2.5px solid var(--ink);border-radius:6px;display:grid;place-items:center;font-weight:900;font-size:13px;background:#fff}
.q[aria-pressed="true"] .box{background:var(--green);color:#fff}
.q:disabled{cursor:default}.q.goodq{background:var(--green-soft)}.q.badq{background:var(--red-soft)}
.answers{display:flex;flex-direction:column;gap:10px}
.qa{border:2.5px solid var(--ink);border-radius:14px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:8px}
.qa h4{font-size:15px}
.ans{display:flex;gap:8px;align-items:flex-start;font-size:15px}
.ans .mini{flex:0 0 34px;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);overflow:hidden}
.ans .mini svg{width:100%;height:100%;display:block}
.qv{align-self:flex-start;font-family:var(--f-display);font-weight:800;font-size:12px;padding:2px 8px;border-radius:6px;border:2px solid var(--ink)}
.qv.g{background:var(--green);color:#fff}.qv.b{background:var(--red);color:#fff}.qv.m{background:var(--sun)}

/* hypothesis builder */
.slots{display:flex;flex-direction:column;gap:12px}
.slot{display:flex;flex-direction:column;gap:6px}
.slot>b{font-family:var(--f-display);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.slot .chips{gap:8px}.slot .chip{font-size:14px;padding:7px 12px}
.preview{font-size:18px;font-weight:600;line-height:1.5;background:var(--sun-soft);border:2.5px solid var(--ink);border-radius:12px;padding:12px 14px}
.preview span{background:#fff;border-bottom:3px solid var(--pink);padding:0 4px;border-radius:3px}
.preview span.empty{color:var(--muted);border-bottom-style:dashed}

/* lanes */
.lanes{display:flex;flex-direction:column;gap:8px}
.lane{position:relative;height:46px;border:2.5px solid var(--ink);border-radius:10px;background:#5c6074;overflow:hidden}
.lane::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:3px dashed var(--sun);opacity:.8}
.lane label{position:absolute;left:8px;top:6px;z-index:2;font-family:var(--f-display);font-weight:800;font-size:11px;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:1px 6px}
.lane .bus{position:absolute;top:12px;left:-60px;width:52px;height:22px;z-index:1;animation:drive linear infinite}
@keyframes drive{to{transform:translateX(calc(100vw + 120px))}}
.lane .stopper{position:absolute;right:10px;top:5px;z-index:2;display:flex;gap:2px}
.abc{width:100%;height:230px;display:block}
.abmeta{display:flex;flex-wrap:wrap;gap:8px 18px;font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums}
.abmeta b{font-family:var(--f-display)}
.legend{display:inline-block;width:16px;height:6px;vertical-align:middle;margin-right:6px;border-radius:3px;border:1.5px solid var(--ink)}
.peek{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--red-soft);border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px}
.peek b{font-family:var(--f-display)}

/* newspaper */
.paper{background:#fffdf5;border:var(--line);border-radius:4px;box-shadow:var(--shadow);padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;transform:rotate(-1deg);animation:spinIn .7s cubic-bezier(.3,1.3,.5,1) both}
@keyframes spinIn{from{opacity:.001;transform:rotate(-200deg) scale(.2)}to{opacity:1;transform:rotate(-1deg) scale(1)}}
.mast{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:3px double var(--ink);padding-bottom:6px;flex-wrap:wrap}
.mast b{font-family:var(--f-display);font-weight:900;font-size:clamp(17px,4vw,22px);letter-spacing:.02em}
.mast small{font-weight:700;font-size:12px;color:var(--muted)}
.headline{font-family:var(--f-display);font-weight:900;font-size:clamp(22px,5vw,30px);line-height:1.1;text-wrap:balance}
.paperBody{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:start}
.paperBody svg{width:110px;height:auto;border:2.5px solid var(--ink);border-radius:6px;background:#fff}
.paperBody p{font-size:15px;font-weight:500}
@media (max-width:480px){.paperBody{grid-template-columns:1fr}.paperBody svg{width:100%;max-height:120px}}

/* crisis */
.phone{max-width:340px;align-self:center;width:100%;background:var(--ink);border-radius:30px;padding:12px;box-shadow:var(--shadow)}
.screen{background:#f4f6fb;border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:250px}
.post{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;font-size:14px;animation:pop .35s both}
.post b{font-family:var(--f-display);font-size:13px}.post small{color:var(--muted);font-weight:600}
.post .likes{font-size:12px;color:var(--red);font-weight:800}
.timer{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:900;font-size:18px}
.tbar{flex:1;height:16px;border:2.5px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.tbar i{display:block;height:100%;width:100%;background:var(--red);transition:width 1s linear}

/* districts */
.mapWrap{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;align-items:start}
@media (max-width:620px){.mapWrap{grid-template-columns:1fr}}
.map svg{width:100%;height:auto;display:block;border:2.5px solid var(--ink);border-radius:14px;background:#bfe9a8}
.map .d{cursor:pointer;transition:fill .4s}
.map .d:hover{filter:brightness(1.08)}
.dlist{display:flex;flex-direction:column;gap:8px}
.dbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:8px 12px;font-weight:700;box-shadow:2px 2px 0 var(--ink);text-align:left}
.dbtn em{font-style:normal;font-family:var(--f-display);font-weight:900}
.dbtn.seen.low{background:var(--red-soft)}.dbtn.seen.hi{background:var(--green-soft)}.dbtn.seen.midd{background:var(--sun-soft)}

/* RICE */
.budget{display:flex;flex-direction:column;gap:6px}
.btrack{height:22px;border-radius:999px;background:#eef3f8;overflow:hidden;border:2.5px solid var(--ink)}
.bfill{height:100%;width:0;background:var(--green);transition:width .4s,background .3s}.bfill.over{background:var(--red)}
.blabel{display:flex;justify-content:space-between;font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums;gap:10px}
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.proj{text-align:left;background:var(--paper);border:var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s,background .15s}
.proj:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.proj[aria-pressed="true"]{background:var(--sun-soft)}
.proj[aria-pressed="true"] h4::before{content:"✔ ";color:var(--green)}
.proj:disabled{cursor:default}
.proj h4{font-size:15px;font-weight:800;line-height:1.2}.proj .d{font-size:13.5px;color:var(--muted);font-weight:600}
.rice{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.rice div{background:#eef3f8;border:1.5px solid var(--ink);border-radius:7px;padding:3px 2px;text-align:center}
.rice small{display:block;font-size:9.5px;font-weight:700;color:var(--muted)}.rice b{font-family:var(--f-display);font-size:13px;font-variant-numeric:tabular-nums}
.pfoot{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-weight:800;font-size:14px}
.score{color:var(--muted)}.score.shown{color:#fff;background:var(--pink);border:2px solid var(--ink);border-radius:6px;padding:1px 7px}
.formula{font-family:var(--f-display);font-weight:800;font-size:15px;background:var(--sun-soft);border:2.5px solid var(--ink);border-radius:10px;padding:10px 12px;line-height:1.35}

/* chart toggle */
.toggle{display:inline-flex;border:2.5px solid var(--ink);border-radius:999px;overflow:hidden;align-self:flex-start}
.toggle button{border:0;background:#fff;padding:6px 14px;font-weight:700;font-size:14px}
.toggle button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* election */
.race{display:flex;flex-direction:column;gap:12px}
.cand{display:grid;grid-template-columns:52px 1fr 60px;gap:10px;align-items:center}
.cand .ava{width:52px;height:52px;flex:none}
.cand .tr{height:30px;border:var(--line);border-radius:999px;background:#eef3f8;overflow:hidden}
.cand .tr i{display:block;height:100%;width:0;transition:width .8s cubic-bezier(.3,1.2,.5,1)}
.cand b{font-family:var(--f-display);font-size:20px;font-weight:900;text-align:right;font-variant-numeric:tabular-nums}
.cand small{display:block;font-weight:700;font-size:13px;margin-bottom:3px}

/* final */
.final{display:flex;flex-direction:column;gap:20px}
.ending{border:var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;background:var(--sun)}
.ending .scene{border:0;border-radius:0;box-shadow:none;border-bottom:var(--line)}
.ending .inner{padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.ending h2{font-size:clamp(28px,6vw,44px)}
.ending p{font-weight:600;max-width:60ch}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.cmp{border:var(--line);border-radius:14px;padding:12px;background:var(--paper);box-shadow:3px 3px 0 var(--ink)}
.cmp small{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cmp div{font-weight:700;font-size:14px;margin-top:2px;font-variant-numeric:tabular-nums}.cmp div b{font-family:var(--f-display);font-size:21px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{display:flex;gap:10px;align-items:center;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px;box-shadow:2px 2px 0 var(--ink)}
.badge svg{width:40px;height:40px;flex:0 0 40px}
.badge b{font-family:var(--f-display);font-size:13.5px;line-height:1.15}.badge small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.25}
.badge.locked{opacity:.4;filter:grayscale(1);box-shadow:none}
.lessons{display:flex;flex-direction:column;border:var(--line);border-radius:16px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow)}
.lessons div{padding:12px 14px;border-top:2px dashed rgba(30,27,51,.2);display:grid;grid-template-columns:120px 1fr;gap:12px;font-size:15px;font-weight:500}
.lessons div:first-child{border-top:0}
.lessons small{font-family:var(--f-display);font-size:11.5px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:#d23f86;padding-top:3px}
.cta-sr{border:var(--line);border-radius:20px;padding:20px;background:var(--green);color:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.cta-sr .eyebrow{background:#fff;color:var(--ink)}
.cta-sr h3{font-size:clamp(21px,4vw,27px);font-weight:900}
.cta-sr p{max-width:60ch;font-weight:600}
.foot{display:flex;justify-content:center;padding-top:6px}

/* intro */
.intro{display:flex;flex-direction:column;gap:20px}
.lede{font-size:18px;max-width:60ch;background:var(--paper);border:var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.lede strong{background:var(--sun-soft);padding:0 3px;border-radius:3px}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.feat{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px;line-height:1.3}
.feat svg{width:30px;height:30px;flex:0 0 30px}
.avatars{display:flex;gap:12px;flex-wrap:wrap}
.avbtn{width:76px;height:76px;border-radius:50%;border:var(--line);padding:0;overflow:hidden;background:#fff;box-shadow:3px 3px 0 var(--ink);transition:transform .1s}
.avbtn svg{width:100%;height:100%;display:block}
.avbtn[aria-pressed="true"]{outline:4px solid var(--pink);outline-offset:3px;transform:scale(1.06)}
.field{display:flex;flex-direction:column;gap:6px;max-width:340px}
.field label{font-family:var(--f-display);font-weight:800;font-size:14px}
.field input{font:inherit;font-weight:600;font-size:17px;border:var(--line);border-radius:12px;padding:10px 14px;box-shadow:3px 3px 0 var(--ink);background:#fff;color:var(--ink)}
.best{font-weight:700;color:var(--muted)}

/* toasts */
.toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{display:flex;gap:10px;align-items:center;background:#fff;border:var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);animation:toastIn .5s cubic-bezier(.3,1.5,.5,1) both;width:100%}
.toast.out{animation:toastOut .4s ease-in forwards}
.toast svg{width:42px;height:42px;flex:0 0 42px}
.toast b{font-family:var(--f-display);font-size:15px}.toast small{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.toast.lvlup{background:var(--sun)}
@keyframes toastIn{from{opacity:0;transform:translateY(30px) scale(.8)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(20px)}}

@media (max-width:540px){
  .lessons div{grid-template-columns:1fr;gap:2px}
  .bar{grid-template-columns:86px 1fr 40px}
  .ava{flex-basis:52px;width:52px;height:52px}
  .txt{font-size:16px}
  .stat small{display:none}
  .stat{padding:2px 7px 2px 3px;gap:4px}
  .stat svg{width:18px;height:18px;flex-basis:18px}
  .stat b{font-size:12.5px}
  .stats{gap:5px;justify-content:space-between}
  .hud{gap:6px 8px;padding-block:7px}
  .brand{font-size:16px}
  .sr span.t{display:none}.sr{padding:2px}
  .lvl{min-width:96px}.pill{font-size:12px;padding:3px 8px}
  .cityWrap{height:150px}
  .residents{grid-template-columns:repeat(3,1fr);gap:6px}.res{padding:8px 4px}.res small{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const stage=$('#stage');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
const sleep=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const INK='#1e1b33';
const CH=['Старт','Первый день','Полярная звезда','Выход в поле','Цифры','Гипотеза','Эксперимент','Последствия','Ловушка','Призраки прошлого','Бюджет','Кризис','Средняя температура','Выборы'];

/* ================= FACES ================= */
function face(o,mood='neutral',noBg=false){
  const f=Object.assign({skin:'#f6c39d',hair:'short',hc:'#3b2550',shirt:'#22b87a',bg:'#c9f3e1'},o);
  const S=`stroke="${INK}" stroke-width="2.5"`;
  let s=noBg?'':`<rect width="64" height="64" fill="${f.bg}"/>`;
  s+=`<path d="M11 66c1-12 9-17 21-17s20 5 21 17z" fill="${f.shirt}" ${S}/>`;
  if(f.tie) s+=`<path d="M29 49l3 11 3-11z" fill="#f04a3a" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>`;
  if(f.collar) s+=`<path d="M26 50l6 5 6-5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>`;
  if(f.hair==='bob') s+=`<path d="M15 37c-3-17 6-26 17-26s20 9 17 26l-3 9H18z" fill="${f.hc}" ${S} stroke-linejoin="round"/>`;
  if(f.hair==='pony') s+=`<path d="M44 22c9 2 11 14 6 24-1-8-4-14-9-17z" fill="${f.hc}" ${S} stroke-linejoin="round"/>`;
  if(f.hair==='bun') s+=`<circle cx="32" cy="12" r="7" fill="${f.hc}" ${S}/><path d="M17 33c-2-12 6-19 15-19s17 7 15 19z" fill="${f.hc}" ${S}/>`;
  if(f.hair==='long') s+=`<path d="M16 34c-2-15 6-23 16-23s18 8 16 23l1 16H15z" fill="${f.hc}" ${S} stroke-linejoin="round"/>`;
  s+=`<ellipse cx="32" cy="34" rx="13.5" ry="15" fill="${f.skin}" ${S}/>`;
  if(f.hair==='short'||f.hair==='pony'||f.hair==='long') s+=`<path d="M18.6 31c-.5-10 5.5-16 13.4-16s14 6 13.4 16c-3-5-8-8-13.4-8-6 0-9 3-13.4 8z" fill="${f.hc}" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>`;
  if(f.hair==='bob') s+=`<path d="M19 28c4-9 18-11 26-1-7-2-15-4-26 1z" fill="${f.hc}" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>`;
  if(f.hair==='bun') s+=`<path d="M20 28c6-5 18-5 24 0-8-2-16-2-24 0z" fill="${f.hc}" stroke="${INK}" stroke-width="2"/>`;
  if(f.hair==='curly') s+=[[22,22,6],[30,18,6.5],[38,18,6.5],[44,23,5.5],[19,29,4.5],[46,30,4.5]].map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}" fill="${f.hc}" stroke="${INK}" stroke-width="2"/>`).join('');
  if(f.hair==='bald') s+=`<path d="M18.5 31c-3-3-3-9 1-10M45.5 31c3-3 3-9-1-10" fill="none" stroke="${f.hc}" stroke-width="4" stroke-linecap="round"/><path d="M18.5 31c-3-3-3-9 1-10M45.5 31c3-3 3-9-1-10" fill="none" stroke="${INK}" stroke-width="1.2" stroke-linecap="round"/>`;
  if(f.hat) s+=`<path d="M17 28c0-10 7-15 15-15s15 5 15 15z" fill="#ff9933" ${S} stroke-linejoin="round"/><path d="M13 28h38" stroke="${INK}" stroke-width="3" stroke-linecap="round"/><path d="M32 13v15" stroke="${INK}" stroke-width="2"/>`;
  // brows
  const br={angry:'M21 27l8 2.5M43 27l-8 2.5',sad:'M21 29l8-2.5M43 29l-8-2.5',happy:'M21 28q4-3 8 0M35 28q4-3 8 0',neutral:'M22 28h7M35 28h7',surprised:'M21 25q4-3 8 0M35 25q4-3 8 0'}[mood]||'M22 28h7M35 28h7';
  s+=`<path d="${br}" stroke="${f.hc==='#d8d8e4'||f.hair==='bald'?'#6b6b80':INK}" stroke-width="${f.hair==='bald'?3.5:2.6}" stroke-linecap="round" fill="none"/>`;
  // eyes
  const er=mood==='surprised'?2.8:2.1;
  if(f.glasses) s+=`<circle cx="26" cy="34" r="5" fill="#fff" stroke="${INK}" stroke-width="2"/><circle cx="38" cy="34" r="5" fill="#fff" stroke="${INK}" stroke-width="2"/><path d="M31 34h2" stroke="${INK}" stroke-width="2"/>`;
  if(mood==='happy'&&!f.glasses) s+=`<path d="M23.5 35q2.5-3 5 0M35.5 35q2.5-3 5 0" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  else s+=`<circle cx="26.3" cy="34.3" r="${er}" fill="${INK}"/><circle cx="38.3" cy="34.3" r="${er}" fill="${INK}"/>`;
  // mouth
  const m={happy:`<path d="M25 41.5c3 5.5 11 5.5 14 0z" fill="#fff" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>`,
    neutral:`<path d="M27.5 43.5h9" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/>`,
    angry:`<path d="M26 45.5c3-3.5 9-3.5 12 0" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/>`,
    sad:`<path d="M27.5 45c2.5-2 6.5-2 9 0" fill="none" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/>`,
    surprised:`<ellipse cx="32" cy="44" rx="3" ry="3.8" fill="${INK}"/>`}[mood];
  s+=m;
  if(f.mustache) s+=`<path d="M22 41.5c4-4 8-3 10-1 2-2 6-3 10 1-3 1-6 2-10 0-4 2-7 1-10 0z" fill="#9b9bab" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>`;
  if(f.blush) s+=`<circle cx="20.5" cy="40" r="2.3" fill="#ff8fbc" opacity=".7"/><circle cx="43.5" cy="40" r="2.3" fill="#ff8fbc" opacity=".7"/>`;
  return s;
}
const faceSvg=(o,mood)=>`<svg viewBox="0 0 64 64" aria-hidden="true">${face(o,mood)}</svg>`;
const faceAt=(o,mood,x,y,size)=>`<svg x="${x}" y="${y}" width="${size}" height="${size}" viewBox="0 0 64 64">${face(o,mood,true)}</svg>`;

const PEOPLE={
  dana:{n:'Дана',r:'аналитик данных',f:{skin:'#f6c39d',hair:'bob',hc:'#3b2550',shirt:'#22b87a',glasses:true,blush:true,bg:'#c9f3e1'}},
  gromov:{n:'Громов',r:'советник, 25 лет в мэрии',f:{skin:'#eba780',hair:'bald',hc:'#c9c9d6',shirt:'#4a5470',tie:true,mustache:true,bg:'#ffd6d1'}},
  timur:{n:'Тимур',r:'инженер транспорта',f:{skin:'#c98b62',hair:'short',hc:'#2b1d14',shirt:'#3d8bff',hat:true,bg:'#d3e6ff'}},
  vera:{n:'Вера Петровна',r:'пенсионерка, 71 год',f:{skin:'#f8d2b4',hair:'bun',hc:'#d8d8e4',shirt:'#ff5fa8',glasses:true,blush:true,bg:'#fff0b8'}},
  artem:{n:'Артём',r:'студент колледжа, 19 лет',f:{skin:'#f1b48c',hair:'curly',hc:'#7a4a2a',shirt:'#ff9933',bg:'#ffe3c7'}},
  aigul:{n:'Айгуль',r:'мама двоих детей, 34 года',f:{skin:'#e8b08a',hair:'pony',hc:'#2a1a1a',shirt:'#8b6cff',collar:true,blush:true,bg:'#efe4ff'}}
};
const MAYORS=[
  {skin:'#f1c4a0',hair:'short',hc:'#3a2418',shirt:'#ffd21f',tie:true,bg:'#fff3b8'},
  {skin:'#f6d0b0',hair:'long',hc:'#c0432b',shirt:'#3d8bff',collar:true,blush:true,bg:'#dcebff'},
  {skin:'#a8714f',hair:'curly',hc:'#1e1b33',shirt:'#22b87a',bg:'#d8f7e8'},

const chEl=$('#chapters');CH.forEach(()=>chEl.appendChild(document.createElement('span')));
function setChapter(i,month){S.chapter=i;if(month!=null)S.month=month;[...chEl.children].forEach((s,k)=>{s.className=k<i?'done':k===i?'now':''});$('#monthTxt').textContent=`Месяц ${S.month}/24`;}
function levelOf(x){let l=0;LEVELS.forEach((L,i)=>{if(x>=L.x)l=i;});return l;}
function renderHud(){
  $('#st-pop b').textContent=fmt(S.pop);$('#st-happy b').textContent=Math.round(S.happy)+'%';
  $('#st-budget b').textContent=fmt(S.budget)+' млн';$('#st-trust b').textContent=Math.round(S.trust);$('#popTag').textContent=fmt(S.pop);
  const l=levelOf(S.xp),cur=LEVELS[l],nx=LEVELS[l+1];
  $('#lvlTxt').textContent=`${cur.n} · ${S.xp} XP`;
  $('#lvlBar').style.width=nx?((S.xp-cur.x)/(nx.x-cur.x)*100)+'%':'100%';
  const st=$('#streak');st.dataset.n=S.streak;$('#streakTxt').textContent='×'+S.streak;
}
function floater(id,val,unit){
  const box=$('#st-'+id);const f=document.createElement('span');
  f.className='fl '+(val>0?'p':'n');f.textContent=(val>0?'+':'−')+fmt(Math.abs(val))+(unit||'');
  box.appendChild(f);setTimeout(()=>f.remove(),1500);
  box.classList.remove('up','down');box.classList.add(val>0?'up':'down');setTimeout(()=>box.classList.remove('up','down'),1400);
}
function apply(fx={},mood){
  const units={pop:'',happy:'%',budget:' млн',trust:''};
  for(const k in fx){if(!(k in units)||!fx[k])continue;const b=S[k];S[k]+=fx[k];
    if(k==='happy')S.happy=Math.max(5,Math.min(98,S.happy));if(k==='trust')S.trust=Math.max(0,Math.min(100,S.trust));if(k==='budget')S.budget=Math.max(0,S.budget);
    const d=S[k]-b;if(d)floater(k,d,units[k]);}
  renderHud();if(mood==='ok')city.confetti(40);if(mood==='bad')city.rain();
}
function toast(html,cls,ms=2600){const box=$('#toasts');while(box.children.length>=2)box.firstChild.remove();const t=document.createElement('div');t.className='toast '+(cls||'');t.innerHTML=html;$('#toasts').appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),450);},ms);}
function achieve(id){if(S.ach.includes(id))return;S.ach.push(id);const a=ACH[id];
  toast(`${badgeSvg(id)}<div><b>Достижение: ${a.n}</b><small>${a.d}</small></div>`);}
function addXP(n){if(!n)return;const before=levelOf(S.xp);S.xp=Math.max(0,S.xp+n);const after=levelOf(S.xp);renderHud();
  if(after>before){setTimeout(()=>{toast(`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#22b87a" stroke="${INK}" stroke-width="2.5"/><path d="M20 10l8 10h-5v9h-6v-9h-5z" fill="#fff" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/></svg><div><b>Новый уровень: ${LEVELS[after].n}</b><small>Вы растёте как продакт</small></div>`,'lvlup',3600);city.confetti(70);},400);}}
/* score a decision: kind ok/mid/bad, pts */
function score(kind,pts){
  S.total++;let got=0;
  if(kind==='ok'){S.correct++;S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);got=pts;if(S.streak>=3)got+=5;if(S.streak===5)achieve('streak5');}
  else if(kind==='mid'){S.streak=0;got=Math.round(pts/2);S.correct+=.5;}
  else S.streak=0;
  addXP(got);return got;
}

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function reveal(n){requestAnimationFrame(()=>n.scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'}));}
function clearStage(){stage.innerHTML='';window.scrollTo({top:0,behavior:'auto'});}

let skipNow=false,typing=0;
stage.addEventListener('click',e=>{if(typing&&!e.target.closest('button,a,input'))skipNow=true;});
function type(node,text){return new Promise(res=>{
  if(reduce){node.textContent=text;res();return;}
  let i=0;typing++;node.classList.add('typing');
  const done=()=>{node.textContent=text;node.classList.remove('typing');typing=Math.max(0,typing-1);skipNow=false;res();};
  const step=()=>{if(skipNow)return done();i+=2;node.textContent=text.slice(0,i);if(i>=text.length)return done();setTimeout(step,14);};step();});}

    const b=el('div','bubble',`<div class="who">${p.n}<em>${p.r}</em></div>`);t=el('p','txt');b.appendChild(t);row.append(av,b);}
  add(row);await type(t,text);await sleep(200);
}

function choices(opts){return new Promise(res=>{
  const box=el('div','choices');
  opts.forEach((o,i)=>{const b=el('button','choice',`<span class="key">${'ABCD'[i]}</span><span>${o.t}</span>`);

      if(k!=='ok'){const r=opts.findIndex(x=>x.ok===true);if(r>-1)box.children[r].classList.add('right');}res(o);};
    box.appendChild(b);});
  add(box);box.choiceButtons=[...box.children];res.box=box;choices.last=box;});}
const TAGS={ok:['По данным!','В точку!','Мощно!','Так держать!'],mid:['Наполовину','Почти!'],bad:['Мимо!','Ой-ой','Промах']};
function feedback({kind,title,text,lesson,lessonTag,xp}){
  if(lesson)S.lessons.push({tag:lessonTag||CH[S.chapter],text:lesson});
  return new Promise(res=>{const tags=TAGS[kind];const tag=tags[Math.floor(Math.random()*tags.length)];
    const f=el('div','fb '+kind,`<div class="fbTop"><span class="fb-tag">${tag}</span>${xp?`<span class="xpTag">+${xp} XP${S.streak>=3&&kind==='ok'?` · серия ×${S.streak}`:''}</span>`:''}</div>${title?`<h3>${title}</h3>`:''}${text?`<p>${text}</p>`:''}${lesson?`<div class="lesson"><span>Урок продакта</span><p>${lesson}</p></div>`:''}`);
    const btn=el('button','btn','Дальше →');btn.onclick=()=>{btn.disabled=true;res();};f.appendChild(btn);add(f);});}
function nextBtn(label,cls){return new Promise(res=>{const b=el('button','btn '+(cls||''),label||'Дальше →');b.onclick=()=>{b.disabled=true;res();};add(b);});}
async function hintOffer(text){
  const row=el('div','row');const b=el('button','btn ghost','Подсказка Даны · −3 XP');row.appendChild(b);add(row);
  b.onclick=()=>{b.remove();S.xp=Math.max(0,S.xp-3);renderHud();row.appendChild(el('div','hintBox',`<b>Дана:</b> ${text}`));};
}
async function quiz(opts,{pts=10,hint,lessonTag,ach}={}){
  if(hint)await hintOffer(hint);
  const o=await choices(opts);
  const kind=o.ok===true?'ok':o.ok==='mid'?'mid':'bad';
  const xp=score(kind,pts);
  if(o.flag)S.flags[o.flag]=true;
  if(kind==='ok'&&ach)achieve(ach);
  apply(o.fx||{},kind==='ok'?'ok':kind==='bad'?'bad':null);
  if(o.react)await say(o.react[0],o.react[1],o.react[2]);
  await feedback({kind,title:o.title,text:o.why,lesson:o.lesson,lessonTag,xp});
  return o;
}

  function visibleCount(){if(!S)return 13;return Math.max(6,Math.min(front.length,Math.round(13+(S.pop-48000)/400)));}

    ctx.fillStyle=mix('#8faa7e','#62c25a',k);ctx.beginPath();ctx.ellipse(W*.78,base+10,W*.42,H*.26,0,Math.PI,0);ctx.fill();
    back.forEach(b=>{const bh=b.h*(base-40);rr(b.x*W,base-bh,b.w*W,bh+3,3,mix('#a9bccb','#9fd0ee',k),2);});
    if(S&&S.flags.wheel){wheelA+=S.flags.wheelClosed?0:.006;const R=Math.min(58,H*.28),cx=W*.73,cy=base-R-10;
      ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx-R*.5,base);ctx.moveTo(cx,cy);ctx.lineTo(cx+R*.5,base);ctx.stroke();

    if(S&&S.flags.it){const w=Math.max(34,W*.05),h=(base-20)*.86,x=W*.46;rr(x,base-h,w,h+3,5,'#5fd6c3',3);for(let y=base-h+10;y<base-8;y+=11){ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(x+5,y,w-10,4);}

async function ch10(){
  chapterHead(10,13,'Бюджет на год: что строим?');
  const budget=S.budget;
  await say('dana',`На следующий год у нас ${budget} млн. Проектов больше, чем денег. Оценим их по RICE.`);
  const why=[];if(S.flags.wheel)why.push('40 млн ушли на колесо обозрения');if(S.flags.park)why.push('10 млн — на парк из-за ложной корреляции');if(S.flags.falsePositive)why.push('10 млн — на исправление поспешного запуска');if(S.flags.wheelRent)why.push('зато аренда колеса принесла 6 млн');
  if(why.length)await say('narr',`Бюджет изменился: ${why.join(', ')}.`);
  add(el('div','panel',`<div class="panel-h"><h3>Как считать RICE</h3></div><div class="formula">RICE = Охват × Влияние × Уверенность ÷ Усилия</div><p class="cap">Охват — сколько жителей затронет за квартал. Влияние — от 0,5 до 3. Уверенность — насколько идея подтверждена данными. Усилия — месяцы работы.</p>`));
  const P=[
    {k:'buses2',n:'Новые автобусы на все маршруты',d:'Масштабируем подтверждённый тест.',R:30000,I:3,C:.8,E:4,cost:35,fx:{pop:2600,happy:7}},
    {k:'yards',n:'Ремонт дворов и озеленение',d:'Жалоба №2 из интервью и обращений.',R:20000,I:1,C:.8,E:3,cost:25,fx:{pop:900,happy:5}},
    {k:'bikes',n:'Сеть велодорожек',d:'Артём и студенты ездят на самокатах.',R:9000,I:2,C:.7,E:3,cost:20,fx:{pop:500,happy:3}},
    {k:'it',n:'IT-парк для новых рабочих мест',d:'Нужны резиденты, гарантий нет.',R:6000,I:3,C:.5,E:8,cost:50,fx:{pop:1600,happy:2}},
    {k:'fountain',n:'Светомузыкальный фонтан',d:'Любимая идея Громова.',R:5000,I:.5,C:.5,E:2,cost:30,fx:{happy:1}}
  ];
  if(!S.flags.wheel)P.push({k:'wheel',n:'Колесо обозрения',d:'Та самая идея из первого дня.',R:8000,I:1,C:.5,E:6,cost:40,fx:{happy:2}});
  P.forEach(p=>p.rice=Math.round(p.R*p.I*p.C/p.E));
  const wrap=el('div','panel');const bud=el('div','budget',`<div class="blabel"><span>Выбрано: <b id="bSel">0</b> млн</span><span>Бюджет: ${budget} млн</span></div><div class="btrack"><div class="bfill" id="bFill"></div></div>`);
  const grid=el('div','projects');const sel=new Set();const row=el('div','row');const calc=el('button','btn ghost','Посчитать RICE');const confirmBtn=el('button','btn pinkb','Утвердить бюджет');confirmBtn.disabled=true;
  function upd(){const s=[...sel].reduce((a,k)=>a+P.find(p=>p.k===k).cost,0);$('#bSel').textContent=s;const f=$('#bFill');f.style.width=Math.min(100,budget?s/budget*100:100)+'%';f.classList.toggle('over',s>budget);confirmBtn.disabled=s>budget||s===0;confirmBtn.textContent=s>budget?'Не хватает бюджета':'Утвердить бюджет';}
  P.forEach(p=>{const c=el('button','proj',`<h4>${p.n}</h4><div class="d">${p.d}</div><div class="rice"><div><small>ОХВАТ</small><b>${p.R/1000}k</b></div><div><small>ВЛИЯН.</small><b>${String(p.I).replace('.',',')}</b></div><div><small>УВЕР.</small><b>${p.C*100}%</b></div><div><small>УСИЛ.</small><b>${p.E} мес</b></div></div><div class="pfoot"><span>${p.cost} млн</span><span class="score">RICE: ?</span></div>`);
    c.setAttribute('aria-pressed','false');c.onclick=()=>{if(sel.has(p.k))sel.delete(p.k);else sel.add(p.k);c.setAttribute('aria-pressed',String(sel.has(p.k)));upd();};p.el=c;grid.appendChild(c);});
  const showRice=()=>P.forEach((p,i)=>setTimeout(()=>{const s=p.el.querySelector('.score');s.textContent='RICE: '+fmt(p.rice);s.classList.add('shown');},reduce?0:i*120));
  calc.onclick=()=>{calc.disabled=true;showRice();};row.append(calc,confirmBtn);wrap.append(bud,grid,row);add(wrap);
  await say('narr','Отметьте проекты в пределах бюджета. Сначала можно нажать «Посчитать RICE».');
  if(budget<20){await say('dana','Денег почти не осталось... Придётся пропустить этот год.','sad');}
  else await new Promise(res=>confirmBtn.onclick=res);
  confirmBtn.disabled=true;if(!calc.disabled){calc.disabled=true;showRice();}P.forEach(p=>p.el.disabled=true);
  let best=0,bm=0;const n=P.length;for(let m=1;m<1<<n;m++){let c=0,r=0;for(let i=0;i<n;i++)if(m>>i&1){c+=P[i].cost;r+=P[i].rice;}if(c<=budget&&r>best){best=r;bm=m;}}
  const optNames=P.filter((p,i)=>bm>>i&1).map(p=>p.n.toLowerCase()).join(', ');
  const chosen=P.filter(p=>sel.has(p.k));const got=chosen.reduce((a,p)=>a+p.rice,0),ratio=best?got/best:0;
  const fx={budget:-chosen.reduce((a,p)=>a+p.cost,0),pop:0,happy:0};chosen.forEach(p=>{fx.pop+=p.fx.pop||0;fx.happy+=p.fx.happy||0;S.flags[p.k]=true;});
  const kind=ratio>.95?'ok':ratio>.6?'mid':'bad';const xp=score(kind,15);if(kind==='ok')achieve('rice');apply(fx,kind==='ok'?'ok':kind==='bad'?'bad':null);
  await feedback({kind,xp,title:`Ваш план даёт ${Math.round(ratio*100)}% от максимальной ценности`,text:ratio>.95?'Вы собрали лучший портфель: максимум ценности за доступные деньги. Посмотрите на город — он строится.':`Лучший набор в этом бюджете: ${optNames}. Дорогие и неуверенные проекты съедают бюджет, а дают мало.`,
    lesson:'RICE помогает сравнивать несравнимое. Недорогой проект с большим охватом и подтверждённым эффектом обычно выгоднее громкой стройки с низкой уверенностью.'});
  const hl=S.flags.fountain?'В центре заработал фонтан. Горожане спрашивают, где дворы':S.flags.yards&&S.flags.bikes?'Во дворах — деревья, на улицах — велодорожки':S.flags.it?'Мэрия строит IT-парк. Резидентов пока ищут':'Мэрия утвердила бюджет года';
  await newspaper(13,hl,'Бюджет утверждён на сессии городского совета. «Мэр ' + S.name + ' считает каждый рубль», — говорят в мэрии. Громов воздержался при голосовании.');
}

    {t:'Среднее скрыло отстающий сегмент. Нужен отдельный план для Заречья: временный автобус через объездной мост',ok:true,fx:{pop:700,happy:3,budget:-5},flag:'zarechie',title:'Сегмент найден',why:'Временный маршрут через объездной мост запустили за месяц. Удовлетворённость в Заречье выросла с 41% до 63%.',
      lesson:'Средние значения прячут сегменты. Всегда разбивай метрику по группам пользователей: районам, возрасту, каналам. Проблема часто живёт в одном сегменте.'},
    {t:'Заречье — выброс. Исключим его из отчёта, чтобы не портил картину',ok:false,fx:{trust:-5},title:'Неудобные данные — тоже данные',why:'Исключать «плохие» сегменты из отчёта — самообман. Журналисты нашли полную таблицу через неделю.'}
  ],{ach:'segment',hint:'Посмотрите, нет ли района, который сильно отличается от остальных. Почему так может быть?'});
  await newspaper(20,S.flags.zarechie?'В Заречье пошёл автобус! «Наконец-то мы снова в городе»':'Мэрия отчиталась о 71% довольных. В Заречье не согласны',S.flags.zarechie?'Временный маршрут через объездной мост соединил район с центром. До выборов — четыре месяца.':'Жители Заречья собрали подписи за отставку мэра. До выборов — четыре месяца.');
}

async function election(){
  chapterHead(13,24,'Ночь выборов');
  scene(sceneElection());
  const approval=Math.max(22,Math.min(82,20+S.happy*.35+S.trust*.18+(S.pop-48000)/400+(S.flags.zarechie?4:0)+(S.flags.crisisOk?3:0)-(S.flags.falsePositive?3:0)-(S.flags.wheel&&!S.flags.wheelRent?3:0)));
  S.approval=approval;
  await say('gromov',approval>=50?'Я выдвинулся против вас, мэр. Но, честно говоря, автобусы — это было неплохо.':'Я выдвинулся против вас, мэр. Город устал от ваших таблиц!',approval>=50?'neutral':'happy');
  await say('narr','Избирательные участки закрыты. Идёт подсчёт голосов по районам…');
  const race=el('div','panel race',`<div class="cand"><div class="ava">${faceSvg(MAYORS[S.av],'neutral')}</div><div><small>Мэр ${nm()}</small><div class="tr"><i id="rA" style="background:#22b87a"></i></div></div><b id="rAv">0%</b></div>
    <div class="cand"><div class="ava">${faceSvg(PEOPLE.gromov.f,'neutral')}</div><div><small>Громов</small><div class="tr"><i id="rB" style="background:#f04a3a"></i></div></div><b id="rBv">0%</b></div><div class="cap" id="rDist">Подсчитано районов: 0 из 5</div>`);
  add(race);
  const dists=['Центр','Северный','Заводской','Новый квартал','Заречье'];let sumA=0;
  for(let i=0;i<5;i++){await sleep(900);const shift=i===4?(S.flags.zarechie?6:-18):[3,1,-2,2,0][i];const a=Math.max(10,Math.min(90,approval+shift));sumA+=a;
    const avg=sumA/(i+1);$('#rA').style.width=avg+'%';$('#rB').style.width=(100-avg)+'%';$('#rAv').textContent=Math.round(avg)+'%';$('#rBv').textContent=Math.round(100-avg)+'%';
    $('#rDist').textContent=`Подсчитано районов: ${i+1} из 5 · ${dists[i]}: ${Math.round(a)}% за мэра`;}
  S.final=sumA/5;await sleep(600);
}

async function finale(){
  setChapter(13,24);clearStage();
  const v=S.final;const win=v>=50;
  const E=v>=62?{t:'Триумф: второй срок',d:`Инсайтград проголосовал за вас уверенно — ${Math.round(v)}%. Люди возвращаются, на остановках не ждут, а Громов попросился к Дане в стажёры.`}
    :v>=50?{t:'Второй срок — с трудом',d:`${Math.round(v)}% — победа, но впритык. Город стал лучше, однако несколько решений стоили вам доверия. Есть что улучшить.`}
    :v>=42?{t:'Проигрыш во втором туре',d:`${Math.round(v)}% — не хватило совсем немного. Громов победил с лозунгом «Без таблиц». Но вы точно знаете, где ошиблись.`}
    :{t:'Мэр Громов',d:`${Math.round(v)}% — город выбрал Громова. Первым указом он заказал второе колесо обозрения. Пройдите ещё раз и дайте слово данным.`};
  if(win)achieve('reelected');
  city.fireworks(win?10:2);if(win)city.confetti(80);
  const acc=S.total?Math.round(S.correct/S.total*100):0;const lvl=LEVELS[levelOf(S.xp)].n;
  try{const prev=localStorage.getItem('mayor-best-v2');const pv=prev?parseInt(prev,10):-1;if(Math.round(v)>=pv)localStorage.setItem('mayor-best-v2',`${Math.round(v)}% голосов · ${lvl}`);}catch(e){}
  const f=el('div','final');
  f.appendChild(el('div','ending',`<div class="scene">${sceneEnding(win)}</div><div class="inner"><span class="eyebrow">Концовка</span><h2>${E.t}</h2><p>${E.d}</p></div>`));
  f.appendChild(el('div','statgrid',`
    <div class="cmp"><small>Уровень продакта</small><div><b>${lvl}</b></div></div>
    <div class="cmp"><small>Решения по данным</small><div><b>${acc}%</b> · ${S.xp} XP</div></div>
    <div class="cmp"><small>Лучшая серия</small><div><b>×${S.bestStreak}</b></div></div>
    <div class="cmp"><small>Жители</small><div>48 000 → <b>${fmt(S.pop)}</b></div></div>
    <div class="cmp"><small>Счастье</small><div>52% → <b>${Math.round(S.happy)}%</b></div></div>
    <div class="cmp"><small>Доверие</small><div>50 → <b>${Math.round(S.trust)}</b></div></div>`));
  f.appendChild(el('h3','',`Достижения: ${S.ach.length} из ${Object.keys(ACH).length}`));
  const bg=el('div','badges');Object.keys(ACH).forEach(id=>{const a=ACH[id];bg.appendChild(el('div','badge'+(S.ach.includes(id)?'':' locked'),`${badgeSvg(id)}<div><b>${a.n}</b><small>${a.d}</small></div>`));});f.appendChild(bg);
  f.appendChild(el('h3','','Что вы прокачали'));
  const ls=el('div','lessons');S.lessons.forEach(l=>ls.appendChild(el('div','',`<small>${l.tag}</small><span>${l.text}</span>`)));f.appendChild(ls);
  f.appendChild(el('div','cta-sr',`<span class="eyebrow">Skill Route · школа продактов</span><h3>Принимайте такие решения не в игре, а в реальном продукте</h3>
    <p>Метрики, интервью, гипотезы, A/B-тесты и приоритизация — база профессии продакт-менеджера. В Skill Route её разбирают на живых кейсах с практиками, а в конце у вас портфолио и понятный путь в профессию.</p>
    <div class="row"><a class="btn" href="https://t.me/skillroute1_bot" target="_blank" rel="noopener">Записаться на курс →</a><a class="btn ghost" href="https://t.me/product_vibe_it" target="_blank" rel="noopener">Telegram-канал</a><a class="btn ghost" href="https://instagram.com/skill.route" target="_blank" rel="noopener">Instagram</a></div>
    <p style="font-size:14px">Напишите боту @skillroute1_bot слово «МЭР» — расскажем про программу и подберём поток.</p>`));
  const again=el('button','btn pinkb big','Пройти ещё раз');again.onclick=()=>{const keep={name:S.name,av:S.av};S=fresh();Object.assign(S,keep);renderHud();run(true);};f.appendChild(again);
  f.appendChild(el('div','foot','<a class="sr" href="https://instagram.com/skill.route" target="_blank" rel="noopener"><span class="sr-mark">SR</span><span class="t">Сделано в Skill Route</span></a>'));
  add(f);window.scrollTo({top:0});
}

function measureTop(){const t=$('#top');document.documentElement.style.setProperty('--topH',(getComputedStyle(t).position==='sticky'?t.offsetHeight:0)+'px');}
new ResizeObserver(measureTop).observe($('#top'));
async function run(skipIntro){
  if(!skipIntro)await intro();
  for(const sc of [ch1,ch2,ch3,ch4,ch5,ch6,ch7,ch8,ch9,ch10,ch11,ch12,election])await sc();
  await finale();
}
S=fresh();renderHud();run(false);
})();
</script>
